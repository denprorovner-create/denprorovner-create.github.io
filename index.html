<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Navigation</title>
    <style>
      /* Reset default browser margins */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Center the content on the screen and use clean system fonts */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f7f7f7;
        color: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* Stack the links vertically with a small gap */
      .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 320px;
        padding: 20px;
      }

      /* Style the links as simple, flat buttons */
      .nav-link {
        display: block;
        padding: 12px 16px;
        text-decoration: none;
        color: #1a1a1a;
        background-color: #ffffff;
        border: 1px solid #d1d1d1;
        border-radius: 4px;
        text-align: center;
        font-size: 16px;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      /* Simple hover effect that darkens the background and border slightly */
      .nav-link:hover,
      .nav-link:focus {
        background-color: #ececec;
        border-color: #a3a3a3;
        outline: none;
      }
    </style>
  </head>
  <body>
    <nav class="nav-menu">
      <a href="game.html" class="nav-link">play great game</a>
      <a href="productivity.html" class="nav-link">productivity :c</a>
    </nav>
  </body>
</html>
